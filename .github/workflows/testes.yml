# Roda os testes automatizados (tests/*.test.js) a cada push ou Pull Request.
# Não precisa de Node instalado na sua máquina — o GitHub roda isso na nuvem dele.
# Resultado aparece na aba "Actions" do repositório, e como ✓/✗ ao lado do commit.
name: Testes

on:
  push:
  pull_request:

jobs:
  testes-automatizados:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v5

      - name: Instalar o Node (só nesta máquina da nuvem, não na sua)
        uses: actions/setup-node@v5
        with:
          node-version: 22

      # Confere a sintaxe de todo arquivo do app (inclusive os que nenhum teste
      # importa, como app.js e mesa-*.js) — um erro de digitação ali só
      # apareceria no navegador.
      - name: Conferir a sintaxe dos arquivos
        run: for f in public/js/*.js public/sw.js; do node --check "$f" || exit 1; done

      # Sem passar caminho: o Node varre o projeto e roda tudo que casa com
      # *.test.js. `node --test tests/` quebra no Node 22+ — lá um diretório
      # solto é tratado como arquivo e ele tenta carregar "tests" como módulo.
      - name: Rodar os testes
        run: node --test
