<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Passagem Sombria — Deck de Campo</title>
  <meta name="description" content="Fichas vivas, campanhas e mesa online para o RPG Passagem Sombria."/>
  <link rel="icon" type="image/svg+xml" href="logo.svg"/>
  <link rel="apple-touch-icon" href="apple-touch-icon.png"/>
  <link rel="manifest" href="manifest.json"/>
  <meta name="theme-color" content="#0a0c15"/>
  <meta name="mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="apple-mobile-web-app-title" content="Passagem Sombria"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="css/estilo.css"/>
</head>
<body>
  <div id="app">
    <div class="carregando"><div class="pulse"></div>Sincronizando com a matriz…</div>
  </div>
  <script type="module" src="js/app.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
      // sw.js já ativa a versão nova sozinho (skipWaiting + clients.claim), sem
      // esperar as abas antigas fecharem — mas sem isto, uma aba já aberta ficava
      // rodando com o app.js antigo (import estático, só carrega uma vez por
      // sessão) mesmo depois do Service Worker trocar de versão por baixo dela.
      // Só um F5/fechar-e-reabrir resolvia. Recarregar na troca de controller
      // garante que a aba sempre acaba rodando a versão que o SW já teria servido
      // de qualquer forma na próxima navegação — só antecipa isso.
      let jaRecarregou = false;
      navigator.serviceWorker.addEventListener("controllerchange", () => {
        if (jaRecarregou) return;
        jaRecarregou = true;
        location.reload();
      });
    }
  </script>
</body>
</html>
