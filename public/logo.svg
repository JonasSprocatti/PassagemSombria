<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Passagem Sombria">
  <defs>
    <linearGradient id="ps-ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#59e3c8"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <radialGradient id="ps-void" cx="0.5" cy="0.42" r="0.6">
      <stop offset="0" stop-color="#05060c"/>
      <stop offset="0.7" stop-color="#0a0c15"/>
      <stop offset="1" stop-color="#141a2b"/>
    </radialGradient>
    <linearGradient id="ps-dia" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd7a0"/>
      <stop offset="1" stop-color="#f0a860"/>
    </linearGradient>
    <filter id="ps-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="1.1" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- tile -->
  <rect x="2" y="2" width="60" height="60" rx="15" fill="#0b0e18"/>
  <rect x="2.75" y="2.75" width="58.5" height="58.5" rx="14.25" fill="none" stroke="url(#ps-ring)" stroke-width="1.5" opacity="0.9"/>

  <!-- o vazio da passagem -->
  <path d="M17 49 L17 30 A15 15 0 0 1 47 30 L47 49 Z" fill="url(#ps-void)"/>

  <!-- anéis do túnel (a passagem entrando no escuro) -->
  <path d="M17 49 L17 30 A15 15 0 0 1 47 30 L47 49" fill="none" stroke="url(#ps-ring)" stroke-width="2.6" stroke-linecap="round"/>
  <path d="M23 49 L23 31 A9 9 0 0 1 41 31 L41 49" fill="none" stroke="#59e3c8" stroke-width="1.5" stroke-linecap="round" opacity="0.55"/>
  <path d="M28.5 49 L28.5 32.5 A3.5 3.5 0 0 1 35.5 32.5 L35.5 49" fill="none" stroke="#a78bfa" stroke-width="1.1" stroke-linecap="round" opacity="0.4"/>

  <!-- estrelas -->
  <circle cx="13" cy="14" r="0.9" fill="#dde3f4" opacity="0.8"/>
  <circle cx="51" cy="12" r="0.7" fill="#59e3c8" opacity="0.8"/>
  <circle cx="49" cy="20" r="0.5" fill="#dde3f4" opacity="0.6"/>

  <!-- o losango ◈ — a estrela no fim da passagem -->
  <g filter="url(#ps-glow)">
    <path d="M32 20 L39 31 L32 42 L25 31 Z" fill="url(#ps-dia)"/>
    <path d="M32 25 L35.4 31 L32 37 L28.6 31 Z" fill="#0b0e18"/>
    <circle cx="32" cy="31" r="1.7" fill="#ffd7a0"/>
  </g>
</svg>
